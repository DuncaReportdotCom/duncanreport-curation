# DuncanReport.com — Add a pinned story to a page, then deploy immediately.
#
# IMPORTANT: on GitHub this file must live at  .github/workflows/add-pick.yml  (next to publish.yml).
# Use it from the Actions tab: "Add pick" -> Run workflow -> fill the fields. It appends the pick to
# manual_picks.json, commits it, and kicks off a deploy-only publish so it's live in ~2 minutes.
name: Add pick

on:
  workflow_dispatch:
    inputs:
      section:
        description: "Which page"
        type: choice
        required: true
        options: [main, politics, world, markets, life-culture, sports]
      headline:
        description: "Headline (exactly as it should read)"
        type: string
        required: true
      url:
        description: "Article URL"
        type: string
        required: true
      photo:
        description: "Show a self-hosted photo?"
        type: boolean
        default: false
      hero:
        description: "Force as the lead story (hero)?"
        type: boolean
        default: false
      feature:
        description: "Dark-red emphasis?"
        type: boolean
        default: false

permissions:
  contents: write        # commit manual_picks.json
  actions: write         # trigger the deploy workflow

concurrency:
  group: manual-picks    # serialize edits so two adds can't clobber the file
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append the pick to manual_picks.json
        env:
          PICK_SECTION: ${{ inputs.section }}
          PICK_HEADLINE: ${{ inputs.headline }}
          PICK_URL: ${{ inputs.url }}
          PICK_PHOTO: ${{ inputs.photo }}
          PICK_HERO: ${{ inputs.hero }}
          PICK_FEATURE: ${{ inputs.feature }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, sys
          path = "manual_picks.json"
          try:
              data = json.load(open(path, encoding="utf-8"))
              if not isinstance(data, dict): data = {}
          except FileNotFoundError:
              data = {}
          sec = os.environ["PICK_SECTION"].strip()
          headline = os.environ["PICK_HEADLINE"].strip()
          url = os.environ["PICK_URL"].strip()
          if not (sec and headline and url):
              print("::error::section, headline and url are all required"); sys.exit(1)
          if not url.startswith("http"):
              print("::error::url must start with http"); sys.exit(1)
          entry = {"headline": headline, "url": url, "added": datetime.date.today().isoformat()}
          for key, ev in (("photo","PICK_PHOTO"), ("hero","PICK_HERO"), ("feature","PICK_FEATURE")):
              if os.environ.get(ev, "false").lower() == "true":
                  entry[key] = True
          data.setdefault(sec, []).append(entry)
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          print("Added to %s: %s" % (sec, json.dumps(entry, ensure_ascii=False)))
          PY
      - name: Commit
        run: |
          git config user.name "duncanreport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_picks.json
          if git diff --cached --quiet; then echo "no change to commit"; exit 0; fi
          git commit -m "Add pick to ${{ inputs.section }}"
          git fetch origin "${{ github.ref_name }}" || true
          git merge -X ours --no-edit "origin/${{ github.ref_name }}" || true
          git push
      - name: Deploy now (rebuild from live + apply the new pick)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --field section=deploy-only
