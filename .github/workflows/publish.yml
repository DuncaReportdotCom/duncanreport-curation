name: Publish DuncanReport

# What to publish (manual dropdown):
#   all             - curate every page, then deploy
#   deploy-only     - no curation; just rebuild from live stories + push code/formatting changes
#   narrative-review- generate the biweekly narrative review (review.json)
#   main/sports/world/markets/politics/life-culture - curate just that one page
#
# Schedules: the four daily crons below are all MORNING attempts. GitHub cron is UTC-only, ignores
# daylight saving, AND is frequently delayed by many minutes, so a single fixed time is unreliable.
# The "gate" job accepts a wide morning window (Central 05:00-11:59) and de-dupes on the live site's
# lastUpdated: the first cron that gets through publishes the day's update, later crons skip, and a
# failed attempt is automatically retried by the next cron. Net effect: ONE reliable morning update
# per day, self-healing against GitHub's cron delays.  1st & 15th 12:00 UTC -> narrative-review.

on:
  schedule:
    # Many morning attempts. GitHub often fires cron late (hours, for this repo), so we buy extra
    # lottery tickets: the de-dupe means only the FIRST one to actually fire publishes; the rest
    # exit in seconds. Spread ~06:00-11:00 Central so an early landing is likely on a good day and a
    # delayed one is still caught.
    - cron: "0 11 * * *"       # ~06:00 Central (CDT) - earliest morning attempt
    - cron: "30 11 * * *"      # ~06:30 Central (CDT)
    - cron: "0 12 * * *"       # ~06:00 Central (CST) / ~07:00 (CDT)
    - cron: "0 13 * * *"       # ~08:00 Central (CDT) - mid-morning retry
    - cron: "30 14 * * *"      # ~09:30 Central (CDT)
    - cron: "30 15 * * *"      # ~09:30 Central (CST) / ~10:30 (CDT)
    - cron: "0 16 * * *"       # ~11:00 Central (CDT) - last morning retry
    - cron: "0 12 1,15 * *"    # biweekly narrative review
  # Auto deploy-only: pushing a story addition (edit to curate.py) or a front-end tweak (index.html)
  # rebuilds and redeploys WITHOUT re-curating - the manual pick appears within a couple minutes.
  # Scoped to these files so the bot's own archive-snapshot commits never re-trigger a run.
  push:
    branches: [main]
    paths:
      - "curate.py"
      - "index.html"
      - "manual_picks.json"
      - "extra_narratives.json"
      - "mockup1.html"
      - "mockup2.html"
      - "mockup3.html"
  workflow_dispatch:
    inputs:
      section:
        description: "What to publish"
        type: choice
        default: all
        options:
          - all
          - deploy-only
          - narrative-review
          - main
          - sports
          - world
          - markets
          - politics
          - life-culture

permissions:
  contents: write

# Only ONE publish run at a time. A manual run overlapping a scheduled/push run was pushing the
# same day's archive snapshots simultaneously, causing a git merge conflict (exit 128). Queuing
# runs (cancel-in-progress: false) makes them wait their turn instead of colliding.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # DST-aware gate: the early daily crons fire (11:00 and 12:00 UTC), but only the one that is 06:xx in
  # US Central right now proceeds - so the real run happens at 06:00 Central all year, adjusting for
  # daylight saving. Manual runs and the narrative-review cron always proceed. A skipped daily cron
  # ends "neutral" (not a failed/red run).
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          EVENT="${{ github.event_name }}"
          SCHED="${{ github.event.schedule }}"
          # Manual runs and the biweekly narrative-review cron always proceed.
          if [ "$EVENT" != "schedule" ] || [ "$SCHED" = "0 12 1,15 * *" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Scheduled daily run. GitHub routinely DELAYS cron by many minutes (worst at the top of
          # the hour), which used to push the run past a narrow hour check and skip the whole morning
          # update. Instead: accept a WIDE morning window (Central 05:00-11:59) and DE-DUPE by the
          # live site's lastUpdated. The first cron of the day that gets through publishes; later
          # crons see today's date and skip. If an earlier attempt failed to deploy, lastUpdated
          # stays old so the next cron automatically RETRIES - the morning update is self-healing.
          # GitHub can delay this repo's cron by SEVERAL HOURS (observed a 06:00 cron firing near
          # 13:40 Central), so the window must be generous - it exists only to avoid a pathological
          # overnight publish, not to enforce a tight time. The de-dupe below is what guarantees a
          # single daily update. Crons never fire EARLY, so the natural earliest publish is ~05-06:00
          # Central; on a good GitHub day that is when it lands, on a bad day it slips later but still
          # runs the same day.
          H=$((10#$(TZ=America/Chicago date +%H)))
          if [ "$H" -lt 5 ] || [ "$H" -gt 17 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Central $(TZ=America/Chicago date +%H:%M) is outside the 05:00-17:59 daytime window."
            exit 0
          fi
          TODAY=$(TZ=America/Chicago date +%Y-%m-%d)
          LU_MS=$(curl -s --max-time 20 https://duncanreport.com/stories.json \
                   | python3 -c "import sys,json; print(int(json.load(sys.stdin).get('lastUpdated',0)))" 2>/dev/null || echo 0)
          LU=$(TZ=America/Chicago date -d "@$((LU_MS/1000))" +%Y-%m-%d 2>/dev/null || echo "")
          if [ "$LU" = "$TODAY" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: site already updated today ($LU) - the morning run already completed."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding: site last updated '$LU', today is '$TODAY' (Central $(TZ=America/Chicago date +%H:%M))."
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (needed for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OCR engine (Tesseract - scans hero/column images for burned-in outlet text)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python packages
        run: pip install anthropic requests pillow pytesseract tweepy

      - name: Build the site
        env:
          SECTION: ${{ github.event.inputs.section || (github.event_name == 'push' && 'deploy-only') || (github.event.schedule == '0 12 1,15 * *' && 'narrative-review') || 'all' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}   # NYT Most Popular trending signal (optional; skipped if unset)
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}   # Bluesky auto-post (handle defaults in code)
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}               # optional override of the default handle
          X_API_KEY: ${{ secrets.X_API_KEY }}                 # X/Twitter auto-post (all four required for X)
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python curate.py

      # Do NOT deploy a broken build: if any page came out empty/broken, abort here so
      # Cloudflare keeps serving the previous good version. Live visitors never see a dead page.
      - name: Guard - block deploy if any page is broken
        run: |
          python -c "import json,sys; d=json.load(open('site/status.json')); c=d.get('critical') or []; [print('::error::broken page, NOT deploying: '+str(x)) for x in c]; print('OK to deploy.' if d.get('deployable',True) else 'DEPLOY BLOCKED - keeping the last good site live'); sys.exit(0 if d.get('deployable',True) else 1)"

      # Persist the daily archive AND the narrative-detector state back to the repo
      # so both survive the next build (the state file drives rise/fall trend).
      - name: Commit archive snapshots
        run: |
          git config user.name "duncanreport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git add narrative_state.json 2>/dev/null || true
          git add gift_links.json 2>/dev/null || true
          git add balance_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git commit -m "Archive snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # If another run already pushed today's snapshots, they will conflict on the same archive
          # files. Those files are regenerated every run, so on any conflict just keep OURS, then
          # push. Retry a few times in case of a fast-follow push from another run.
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}" || true
            git merge -X ours --no-edit "origin/${{ github.ref_name }}" || true
            if git push; then pushed=1; break; fi
            echo "push attempt $i failed - retrying..."; sleep 4
          done
          if [ "$pushed" != "1" ]; then echo "::warning::archive push did not complete (non-fatal)"; fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2b76296956fb323c9573be5467c8037
        run: npx wrangler@3 pages deploy site --project-name=duncanreport

      # Turn ANY detected problem (failed section, empty page, no credits, scoreboard
      # error, or a crash) into a red run so GitHub emails you automatically.
      - name: Health check - alert if anything broke
        if: always()
        run: |
          python -c "import json,sys; d=json.load(open('site/status.json')); p=d.get('problems') or []; [print('::error::'+str(x)) for x in p]; print('Health OK' if (not p and d.get('ok',True)) else 'PROBLEMS FOUND'); sys.exit(0 if (not p and d.get('ok',True)) else 1)"
