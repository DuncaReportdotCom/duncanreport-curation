name: Publish DuncanReport

# What to publish (manual dropdown):
#   all             - curate every page, then deploy
#   deploy-only     - no curation; just rebuild from live stories + push code/formatting changes
#   narrative-review- generate the biweekly narrative review (review.json)
#   main/sports/world/markets/politics/life-culture - curate just that one page
#
# Schedules: daily 13:00 UTC (08:00 Central) -> full "all"; 1st & 15th 12:00 UTC -> narrative-review.

on:
  schedule:
    - cron: "0 13 * * *"       # daily full curation - 08:00 Central (CDT) / 07:00 (CST)
    - cron: "0 12 1,15 * *"    # biweekly narrative review
  workflow_dispatch:
    inputs:
      section:
        description: "What to publish"
        type: choice
        default: all
        options:
          - all
          - deploy-only
          - narrative-review
          - main
          - sports
          - world
          - markets
          - politics
          - life-culture

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (needed for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OCR engine (Tesseract - scans hero/column images for burned-in outlet text)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python packages
        run: pip install anthropic requests pillow pytesseract

      - name: Build the site
        env:
          SECTION: ${{ github.event.inputs.section || (github.event.schedule == '0 12 1,15 * *' && 'narrative-review' || 'all') }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: python curate.py

      # Do NOT deploy a broken build: if any page came out empty/broken, abort here so
      # Cloudflare keeps serving the previous good version. Live visitors never see a dead page.
      - name: Guard - block deploy if any page is broken
        run: |
          python -c "import json,sys; d=json.load(open('site/status.json')); c=d.get('critical') or []; [print('::error::broken page, NOT deploying: '+str(x)) for x in c]; print('OK to deploy.' if d.get('deployable',True) else 'DEPLOY BLOCKED - keeping the last good site live'); sys.exit(0 if d.get('deployable',True) else 1)"

      # Persist the daily archive AND the narrative-detector state back to the repo
      # so both survive the next build (the state file drives rise/fall trend).
      - name: Commit archive snapshots
        run: |
          git config user.name "duncanreport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git add narrative_state.json 2>/dev/null || true
          git add gift_links.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Archive snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          else
            echo "No archive changes to commit."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2b76296956fb323c9573be5467c8037
        run: npx wrangler@3 pages deploy site --project-name=duncanreport

      # Turn ANY detected problem (failed section, empty page, no credits, scoreboard
      # error, or a crash) into a red run so GitHub emails you automatically.
      - name: Health check - alert if anything broke
        if: always()
        run: |
          python -c "import json,sys; d=json.load(open('site/status.json')); p=d.get('problems') or []; [print('::error::'+str(x)) for x in p]; print('Health OK' if (not p and d.get('ok',True)) else 'PROBLEMS FOUND'); sys.exit(0 if (not p and d.get('ok',True)) else 1)"

